# Render Blueprint — CryptoExchange_PRO
# Creates only the backend Web Service (FastAPI) on the free plan.
# Postgres and Redis are external free providers (Neon / Upstash) injected
# via env vars; values are set once in Render and marked "sync: false"
# so they are not overwritten on blueprint re-deploys.
#
# Note: Background workers (Celery worker/beat) are NOT included because the
# Render plan in use does not allow background workers. The API works without
# them (Redis used for cache/rate-limit; TP/SL monitor runs in-process).

services:
  # ---------- Backend API ----------
  - type: web
    name: cryptoexchange-backend
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: "/api/v1"
      - key: CORS_ORIGINS
        value: "https://<FRONTEND_URL_HERE>"
      - key: ALLOWED_HOSTS
        value: "*"
