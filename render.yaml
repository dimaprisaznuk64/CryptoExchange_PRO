# Render Blueprint — CryptoExchange_PRO
# Creates backend Web Service (FastAPI) + Celery worker + Celery beat.
# Postgres and Redis are external free providers (Neon / Upstash) and are
# injected via env vars — set their values once in Render, mark them "sync: false"
# so they are not overwritten on blueprint re-deploys.

services:
  # ---------- Backend API ----------
  - type: web
    name: cryptoexchange-backend
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: "/api/v1"
      - key: CORS_ORIGINS
        value: "https://<FRONTEND_URL_HERE>"
      - key: ALLOWED_HOSTS
        value: "*"

  # ---------- Celery worker ----------
  - type: worker
    name: cryptoexchange-worker
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile.worker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        sync: false

  # ---------- Celery beat ----------
  - type: worker
    name: cryptoexchange-beat
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile.beat
    plan: free
    envVars:
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
