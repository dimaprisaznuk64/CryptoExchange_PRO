# Render Blueprint — CryptoExchange_PRO
# Applies via Render Dashboard → New → Blueprint (connect this repo).
#
# Creates: backend Web Service (FastAPI) + celery worker + celery beat
#          + managed Postgres + managed Redis.
# Resources are wired through internal service env vars.

services:
  # ---------- PostgreSQL ----------
  - type: postgres
    name: cryptoexchange-db
    plan: free
    database: cryptoexchange
    ipAllowList: []

  # ---------- Redis ----------
  - type: redis
    name: cryptoexchange-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---------- Backend API ----------
  - type: web
    name: cryptoexchange-backend
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: cryptoexchange-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: "/api/v1"
      - key: CORS_ORIGINS
        value: "https://<FRONTEND_URL_HERE>"
      - key: ALLOWED_HOSTS
        value: "*"

  # ---------- Celery worker ----------
  - type: worker
    name: cryptoexchange-worker
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile
    command: celery -A app.tasks worker --concurrency=1 --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cryptoexchange-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ---------- Celery beat ----------
  - type: worker
    name: cryptoexchange-beat
    runtime: docker
    repo: https://github.com/dimaprisaznuk64/CryptoExchange_PRO.git
    dockerfilePath: ./backend/Dockerfile
    command: celery -A app.tasks beat --loglevel=info
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: cryptoexchange-redis
          type: redis
          property: connectionString
